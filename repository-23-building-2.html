<style>

  * { box-sizing: border-box; }

    background: var(--bg);

    font-family: var(--display);

    padding: 2.5rem 1rem 4rem;
  }
  h1 {
    font-weight: 600;
    font-style: italic;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    margin: 0 0 1.75rem;
    letter-spacing: -0.01em;
  }
  .plan-wrap {
    background: var(--raised);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1.5rem;
    max-width: 900px;
    width: 100%;
    overflow-x: auto;
  }
  .plan-wrap svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
</style>
