<style>
  :root {
    --bg: #0e1512;
    --ink: #ece6d4;
    --brass: #c39a5a;
    --line: #33362a;
    --raised: #171f19;
    --display: "Fraunces", Georgia, serif;
    --mono: "Space Mono", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--display);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 4rem;
  }
  h1 {
    font-weight: 600;
    font-style: italic;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    margin: 0 0 1.75rem;
    letter-spacing: -0.01em;
  }
  .plan-wrap {
    background: var(--raised);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1.5rem;
    max-width: 900px;
    width: 100%;
    overflow-x: auto;
  }
  .plan-wrap svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
</style>
